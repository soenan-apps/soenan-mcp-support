[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soenan-mcp-support"
version = "0.1.0"
description = "Support utilities for applications and agents that use Soenan MCP"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Soenan" }]
dependencies = ["cryptography==50.0.0"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/soenan-apps/soenan-mcp-support"

[project.scripts]
soenan-mcp-transfer = "soenan_mcp_support.transfer._cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
soenan_mcp_support = ["py.typed"]
