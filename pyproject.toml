[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soenan-audaligo-support"
version = "0.1.0"
description = "Generated Audaligo API client and direct encrypted transfer support"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Soenan" }]
dependencies = [
  "attrs>=22.2.0",
  "cryptography==50.0.0",
  "httpx>=0.23.1,<0.29.0",
  "typing-extensions>=4.7.1",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/soenan-apps/soenan-mcp-support"

[project.scripts]
soenan-audaligo-transfer = "soenan_audaligo_support.transfer._cli:main"

[tool.setuptools.packages.find]
where = ["src", "generated"]

[tool.setuptools.package-data]
soenan_audaligo_support = ["py.typed"]
